<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="demoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#demoGrad)"/>
  
  <!-- Document/File icon -->
  <g transform="translate(50,50)">
    <!-- Main document shape -->
    <rect x="-20" y="-25" width="30" height="40" rx="2" fill="white" opacity="0.95"/>
    <path d="M 10,-25 L 10,-15 L 20,-15 L 10,-25 Z" fill="white" opacity="0.8"/>
    
    <!-- Folded corner -->
    <path d="M 10,-25 L 10,-15 L 20,-15" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    
    <!-- Text lines -->
    <line x1="-15" y1="-12" x2="5" y2="-12" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="-15" y1="-4" x2="15" y2="-4" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="-15" y1="4" x2="12" y2="4" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Play/Demo icon -->
    <circle cx="-5" cy="18" r="10" fill="#3b82f6" opacity="0.2"/>
    <path d="M -8,13 L -8,23 L 0,18 Z" fill="white"/>
  </g>
</svg>
