<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#portalGrad)"/>
  
  <!-- Users/People icon -->
  <g transform="translate(50,50)">
    <!-- Front person -->
    <g>
      <!-- Head -->
      <circle cx="0" cy="-8" r="7" fill="white" opacity="0.95"/>
      <!-- Body -->
      <path d="M -10,8 Q -10,0 0,0 Q 10,0 10,8 L 8,20 L -8,20 Z" fill="white" opacity="0.95"/>
    </g>
    
    <!-- Back left person -->
    <g opacity="0.6">
      <!-- Head -->
      <circle cx="-14" cy="-5" r="6" fill="white"/>
      <!-- Body -->
      <path d="M -21,8 Q -21,1 -14,1 Q -7,1 -7,8" fill="white"/>
    </g>
    
    <!-- Back right person -->
    <g opacity="0.6">
      <!-- Head -->
      <circle cx="14" cy="-5" r="6" fill="white"/>
      <!-- Body -->
      <path d="M 7,8 Q 7,1 14,1 Q 21,1 21,8" fill="white"/>
    </g>
    
    <!-- Connection dots (community aspect) -->
    <circle cx="0" cy="25" r="2" fill="#f97316" opacity="0.7"/>
    <circle cx="-8" cy="25" r="1.5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="8" cy="25" r="1.5" fill="#eab308" opacity="0.7"/>
  </g>
</svg>
