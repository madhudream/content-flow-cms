<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="taxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#taxGrad)"/>
  
  <!-- Calculator/Form icon -->
  <g transform="translate(50,50)">
    <!-- Calculator body -->
    <rect x="-18" y="-24" width="36" height="48" rx="3" fill="white" opacity="0.95"/>
    
    <!-- Display screen -->
    <rect x="-14" y="-20" width="28" height="10" rx="1.5" fill="#8b5cf6" opacity="0.3"/>
    <text x="10" y="-12" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#8b5cf6" text-anchor="end">$$$</text>
    
    <!-- Calculator buttons grid -->
    <g opacity="0.4">
      <!-- Row 1 -->
      <circle cx="-8" cy="-2" r="3" fill="#ec4899"/>
      <circle cx="0" cy="-2" r="3" fill="#ec4899"/>
      <circle cx="8" cy="-2" r="3" fill="#ec4899"/>
      
      <!-- Row 2 -->
      <circle cx="-8" cy="6" r="3" fill="#f43f5e"/>
      <circle cx="0" cy="6" r="3" fill="#f43f5e"/>
      <circle cx="8" cy="6" r="3" fill="#f43f5e"/>
      
      <!-- Row 3 -->
      <circle cx="-8" cy="14" r="3" fill="#f43f5e"/>
      <circle cx="0" cy="14" r="3" fill="#f43f5e"/>
      <circle cx="8" cy="14" r="3" fill="#f43f5e"/>
    </g>
    
    <!-- Plus sign accent -->
    <line x1="6" y1="13" x2="10" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="11" x2="8" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
