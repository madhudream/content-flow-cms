<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Content icon - stylized file/document with sparkle -->
  <g transform="translate(50,50)">
    <!-- Document shape -->
    <path d="M -15,-20 L 5,-20 L 15,-10 L 15,20 L -15,20 Z" fill="white" opacity="0.95"/>
    <path d="M 5,-20 L 5,-10 L 15,-10" fill="none" stroke="white" stroke-width="2" opacity="0.95"/>
    
    <!-- Content lines -->
    <line x1="-10" y1="-10" x2="10" y2="-10" stroke="url(#grad1)" stroke-width="2" opacity="0.7"/>
    <line x1="-10" y1="-2" x2="10" y2="-2" stroke="url(#grad1)" stroke-width="2" opacity="0.7"/>
    <line x1="-10" y1="6" x2="5" y2="6" stroke="url(#grad1)" stroke-width="2" opacity="0.7"/>
    
    <!-- Sparkle -->
    <path d="M 18,15 L 20,17 L 18,19 L 16,17 Z" fill="#fbbf24"/>
    <circle cx="18" cy="17" r="1.5" fill="white"/>
  </g>
</svg>
